---
Name: silvershop-address-formats
After:
  - silvershop-extensions
---
SilverShop\Model\Address:
  extensions:
    - SilverShop\AddressFormats\Extension\CustomerAddressExtension

SilverShop\AddressFormats\AddressFormatRegistry:
  live_country_switching: true
  formats:
    default:
      required: ['Address', 'City', 'PostalCode']
      hidden: []
      labels: {}
      postcode_regex: ''
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{PostalCode} {City}'
        - '{State}'
        - '{Country}'
    NL:
      required: ['Address', 'HouseNumber', 'PostalCode', 'City']
      hidden: ['State', 'AddressLine2']
      house_number: true
      field_groups:
        - ['Address', 'HouseNumber']
        - ['PostalCode', 'City']
      narrow_fields: ['HouseNumber', 'PostalCode']
      labels:
        Address: 'Street'
        HouseNumber: 'HouseNumber'
        PostalCode: 'Postcode'
        City: 'City'
      postcode_regex: '/^[0-9]{4}\s?[A-Za-z]{2}$/'
      postcode_transform: 'nl'
      format:
        - '{Address} {HouseNumber}'
        - '{AddressLine2}'
        - '{PostalCode} {City}'
        - '{Country}'
    BE:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels:
        PostalCode: 'Postcode'
      postcode_regex: '/^[0-9]{4}$/'
    DE:
      required: ['Address', 'HouseNumber', 'PostalCode', 'City']
      hidden: ['State']
      house_number: true
      field_groups:
        - ['Address', 'HouseNumber']
      narrow_fields: ['HouseNumber']
      labels:
        PostalCode: 'Postcode'
        City: 'City'
        Address: 'Street'
        HouseNumber: 'HouseNumber'
      postcode_regex: '/^[0-9]{5}$/'
      format:
        - '{Address} {HouseNumber}'
        - '{AddressLine2}'
        - '{PostalCode} {City}'
        - '{Country}'
    FR:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels:
        PostalCode: 'PostalCode'
        City: 'City'
      postcode_regex: '/^[0-9]{5}$/'
    GB:
      required: ['Address', 'City', 'PostalCode']
      hidden: ['State']
      labels:
        PostalCode: 'Postcode'
        City: 'TownCity'
      postcode_regex: '/^[A-Za-z]{1,2}[0-9Rr][0-9A-Za-z]?\s?[0-9][ABD-HJLNP-UW-Zabd-hjlnp-uw-z]{2}$/'
      postcode_transform: 'upper'
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{City}'
        - '{PostalCode}'
        - '{Country}'
    US:
      required: ['Address', 'City', 'State', 'PostalCode']
      hidden: []
      labels:
        PostalCode: 'ZipCode'
        State: 'State'
      postcode_regex: '/^[0-9]{5}(-[0-9]{4})?$/'
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{City}, {State} {PostalCode}'
        - '{Country}'
    NZ:
      required: ['Address', 'City', 'PostalCode']
      hidden: ['State']
      labels:
        PostalCode: 'Postcode'
        City: 'TownCity'
        AddressLine2: 'Suburb'
      postcode_regex: '/^[0-9]{4}$/'
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{City} {PostalCode}'
        - '{Country}'
    AU:
      required: ['Address', 'City', 'State', 'PostalCode']
      hidden: []
      labels:
        PostalCode: 'Postcode'
        City: 'SuburbTown'
        State: 'StateTerritory'
      postcode_regex: '/^[0-9]{4}$/'
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{City} {State} {PostalCode}'
        - '{Country}'
    AT:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'Postcode', City: 'City'}
      postcode_regex: '/^[0-9]{4}$/'
    CH:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'Postcode', City: 'City'}
      postcode_regex: '/^[0-9]{4}$/'
    CZ:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{3}\s?[0-9]{2}$/'
    DK:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{4}$/'
    ES:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'PostalCode', City: 'City'}
      postcode_regex: '/^[0-9]{5}$/'
    FI:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{5}$/'
    IE:
      required: ['Address', 'City']
      hidden: ['State']
      labels: {PostalCode: 'Eircode', City: 'TownCity'}
      postcode_regex: ''
    IT:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'Postcode', City: 'City'}
      postcode_regex: '/^[0-9]{5}$/'
    LU:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{4}$/'
    NO:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{4}$/'
    PL:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'PostalCode', City: 'City'}
      postcode_regex: '/^[0-9]{2}-[0-9]{3}$/'
    PT:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      labels: {PostalCode: 'PostalCode', City: 'City'}
      postcode_regex: '/^[0-9]{4}-[0-9]{3}$/'
    SE:
      required: ['Address', 'PostalCode', 'City']
      hidden: ['State']
      postcode_regex: '/^[0-9]{3}\s?[0-9]{2}$/'
    CA:
      required: ['Address', 'City', 'State', 'PostalCode']
      hidden: []
      labels: {State: 'Province', PostalCode: 'PostalCode'}
      postcode_regex: '/^[A-Za-z][0-9][A-Za-z]\s?[0-9][A-Za-z][0-9]$/'
      postcode_transform: 'ca'
      format:
        - '{Address}'
        - '{AddressLine2}'
        - '{City} {State}  {PostalCode}'
        - '{Country}'
    JP:
      required: ['Address', 'City', 'State', 'PostalCode']
      hidden: []
      labels: {State: 'Prefecture', PostalCode: 'PostalCode', City: 'CityWard'}
      postcode_regex: '/^[0-9]{3}-?[0-9]{4}$/'
---
Name: silvershop-address-formats-orderadmin
Only:
  moduleexists: 'silvershop-suite/order-admin'
---
# Format the order-admin's shipping/billing address cards per country, from the outside (the order-admin fires
# an `updateAddressLines` seam and has no dependency on this module). Only active when order-admin is installed.
SilverShop\OrderAdmin\Form\OrderAddressField:
  extensions:
    - SilverShop\AddressFormats\Extension\OrderAddressFieldExtension
